# 集成测试 profile：连 campus_test；独立 schema t_<32hex> 由 DbTestSupport 动态设置。
# 严禁连接 campus_dev 或外部库；结束只清理测试自建 schema（03 契约 §3）。
spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/campus_test}
    username: ${TEST_DB_USERNAME:campus_app}
    password: ${TEST_DB_PASSWORD:campus_app_dev}

app:
  demo-seed: false
