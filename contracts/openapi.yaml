        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
