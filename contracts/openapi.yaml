components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Role:
      type: string
      enum:
        - APPLICANT
        - APPROVER
        - ADMIN
    Identity:
      type: string
      enum:
        - TEACHER
        - STUDENT
    Permission:
      type: string
      enum:
        - USER_MANAGE
        - RESOURCE_MANAGE
        - RESOURCE_CONFIRM
        - AUDIT_READ
    ActivityStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVER
        - APPROVED_UNRESERVED
        - SCHEDULED
        - OPEN
        - CANCELLED
    ChangeStatus:
      type: string
      enum:
        - AWAITING_CONFIRMATIONS
        - PENDING_APPROVER
        - PENDING_RESOURCE
        - APPLIED
        - REJECTED
        - CONFLICTED
        - WITHDRAWN
        - CANCELLED_BY_ACTIVITY
    Decision:
      type: string
      enum:
        - APPROVE
        - REJECT
    Risk:
      type: string
      enum:
        - NORMAL
        - AT_RISK
    ResourceKind:
      type: string
      enum:
        - VENUE
        - EQUIPMENT
    ConflictCode:
      type: string
      enum:
        - VENUE_CAPACITY
        - OUTSIDE_HOURS
        - VENUE_OCCUPIED
        - EQUIPMENT_SHORTAGE
        - RESOURCE_FAULT
    RegistrationStatus:
      type: string
      enum:
        - ACTIVE
        - WITHDRAWN
        - CANCELLED
    CalendarSegment:
      type: string
      enum:
        - SETUP
        - EVENT
        - TEARDOWN
        - FAULT
    RegistrationAction:
      type: string
      enum:
        - JOIN
        - WITHDRAW
    ApprovalScope:
      type: object
      required:
        - organizationId
        - resourceCategories
      properties:
        organizationId:
          type: string
          format: uuid
        resourceCategories:
          type: array
          items:
            type: string
    AuthorizationInput:
      type: object
      required:
        - identity
        - roles
        - permissions
        - approvalScopes
        - managedResourceIds
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        approvalScopes:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalScope"
        managedResourceIds:
          type: array
          items:
            type: string
            format: uuid
      description: 完整替换。identity不产生角色权限；ADMIN缺失时permissions/managedResourceIds须为空，APPROVER缺失时approvalScopes须为空；范围不接受通配符。
    UserCreate:
      type: object
      required:
        - identity
        - roles
        - permissions
        - approvalScopes
        - managedResourceIds
        - username
        - displayName
        - password
        - organizationId
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        approvalScopes:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalScope"
        managedResourceIds:
          type: array
          items:
            type: string
            format: uuid
        username:
          type: string
        displayName:
          type: string
        password:
          type: string
        organizationId:
          type: string
          format: uuid
    ResourceEligibility:
      type: object
      required:
        - allowTeacher
        - allowStudent
      properties:
        allowTeacher:
          type: boolean
        allowStudent:
          type: boolean
    StaffView:
      type: object
      required:
        - id
        - displayName
        - organizationId
        - enabled
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        organizationId:
          type: string
          format: uuid
        enabled:
          type: boolean
    Actor:
      type: object
      required:
        - identity
        - roles
        - permissions
        - approvalScopes
        - managedResourceIds
        - id
        - displayName
        - organizationId
        - enabled
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        approvalScopes:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalScope"
        managedResourceIds:
          type: array
          items:
            type: string
            format: uuid
        id:
          type: string
          format: uuid
        displayName:
          type: string
        organizationId:
          type: string
          format: uuid
        enabled:
          type: boolean
    EquipmentNeed:
      type: object
      required:
        - resourceId
        - quantity
      properties:
        resourceId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    Plan:
      type: object
      required:
        - startAt
        - endAt
        - setupMinutes
        - teardownMinutes
        - venueId
        - equipment
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        setupMinutes:
          type: integer
          minimum: 0
          maximum: 120
        teardownMinutes:
          type: integer
          minimum: 0
          maximum: 120
        venueId:
          type: string
          format: uuid
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentNeed"
      description: 活动30分钟至6小时，时间为分钟精度；含布撤场的完整区间在同一上海自然日且位于资源开放区间；设备ID不得重复。
    ActivityInput:
      type: object
      required:
        - title
        - description
        - expectedAttendees
        - registrationCapacity
        - staffUserIds
        - plan
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        expectedAttendees:
          type: integer
          minimum: 1
        registrationCapacity:
          type: integer
          minimum: 1
        staffUserIds:
          type: array
          items:
            type: string
            format: uuid
        plan:
          $ref: "#/components/schemas/Plan"
    ActivityView:
      type: object
      required:
        - id
        - organizationId
        - ownerId
        - status
        - versionNo
        - effectiveVersionNo
        - lockVersion
        - input
        - registrationCount
        - resourceRisk
        - activeChangeId
        - myRegistrationStatus
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ActivityStatus"
        versionNo:
          type: integer
        effectiveVersionNo:
          type: integer
          nullable: true
        lockVersion:
          type: integer
        input:
          $ref: "#/components/schemas/ActivityInput"
        registrationCount:
          type: integer
        resourceRisk:
          $ref: "#/components/schemas/Risk"
        activeChangeId:
          type: string
          format: uuid
          nullable: true
        myRegistrationStatus:
          allOf:
            - $ref: "#/components/schemas/RegistrationStatus"
          nullable: true
        createdAt:
          type: string
          format: date-time
    VersionCommand:
      type: object
      required:
        - expectedLockVersion
      properties:
        expectedLockVersion:
          type: integer
          minimum: 0
    ReasonCommand:
      type: object
      required:
        - expectedLockVersion
        - reason
      properties:
        expectedLockVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 1000
          minLength: 1
    ActivityEdit:
      type: object
      required:
        - expectedLockVersion
        - input
      properties:
        expectedLockVersion:
          type: integer
          minimum: 0
        input:
          $ref: "#/components/schemas/ActivityInput"
    ApprovalCommand:
      type: object
      required:
        - expectedLockVersion
        - decision
        - comment
      properties:
        expectedLockVersion:
          type: integer
          minimum: 0
        decision:
          $ref: "#/components/schemas/Decision"
        comment:
          type: string
          maxLength: 1000
    ResourceCreate:
      type: object
      required:
        - allowTeacher
        - allowStudent
        - kind
        - name
        - category
        - capacity
        - quantity
        - openFrom
        - openTo
      properties:
        allowTeacher:
          type: boolean
        allowStudent:
          type: boolean
        kind:
          $ref: "#/components/schemas/ResourceKind"
        name:
          type: string
        category:
          type: string
        capacity:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
        openFrom:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        openTo:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
    ResourceView:
      type: object
      required:
        - allowTeacher
        - allowStudent
        - kind
        - name
        - category
        - capacity
        - quantity
        - openFrom
        - openTo
        - id
        - createdAt
      properties:
        allowTeacher:
          type: boolean
        allowStudent:
          type: boolean
        kind:
          $ref: "#/components/schemas/ResourceKind"
        name:
          type: string
        category:
          type: string
        capacity:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
        openFrom:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        openTo:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    FaultInput:
      type: object
      required:
        - startAt
        - endAt
        - unavailableQuantity
        - reason
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        unavailableQuantity:
          type: integer
        reason:
          type: string
          maxLength: 1000
          minLength: 1
    AffectedActivity:
